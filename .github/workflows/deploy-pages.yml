name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/diagnostic-tool/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/diagnostic-tool

      - name: Build
        run: npm run build
        working-directory: apps/diagnostic-tool

      - name: Add .nojekyll
        run: touch apps/diagnostic-tool/out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/diagnostic-tool/out
